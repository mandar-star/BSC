// ---------- Indian currency formatter ----------
function inr(n, { compact=false } = {}) {
  if (n == null) return '—';
  const neg = n < 0; n = Math.abs(n);
  if (compact && n >= 10000000) return (neg?'−':'') + '₹' + (n/10000000).toFixed(n>=1e8?1:2) + ' Cr';
  if (compact && n >= 100000)   return (neg?'−':'') + '₹' + (n/100000).toFixed(n>=1e6?1:2) + ' L';
  const s = Math.round(n).toString();
  const lastThree = s.substring(s.length-3);
  const other = s.substring(0, s.length-3);
  const formatted = (other ? other.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," : "") + lastThree;
  return (neg?'−':'') + '₹' + formatted;
}

// ---------- Small components ----------
function Sparkline({ data, stroke=C.deep, fill='rgba(123,189,232,0.18)', h=44 }) {
  const w = 160;
  const min = Math.min(...data.map(d=>d.v)), max = Math.max(...data.map(d=>d.v));
  const range = max - min || 1;
  const pts = data.map((d,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - 4 - ((d.v - min)/range)*(h-10);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = path + ` L ${w} ${h} L 0 ${h} Z`;
  const last = pts[pts.length-1];
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} preserveAspectRatio="none" className="block">
      <path d={area} fill={fill} />
      <path d={path} stroke={stroke} strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={last[0]} cy={last[1]} r="3" fill={stroke}/>
      <circle cx={last[0]} cy={last[1]} r="6" fill={stroke} opacity="0.18"/>
    </svg>
  );
}

function Delta({ v, weak }) {
  const up = v >= 0;
  const color = weak ? C.warn : (up ? C.ok : C.risk);
  return (
    <span className="inline-flex items-center gap-1 mono text-[12px] tnum" style={{ color }}>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path d={up?'M2 7 5 3 8 7':'M2 3 5 7 8 3'} stroke={color} strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      {up?'+':''}{v.toFixed(1)}%
    </span>
  );
}

function ProgressRing({ pct=0, size=44, stroke=4, color=C.deep, track='#E6EEF6' }) {
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c * (1 - Math.min(1, Math.max(0, pct/100)));
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
        strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
        transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x="50%" y="52%" textAnchor="middle" dominantBaseline="middle"
        fontFamily="JetBrains Mono, ui-monospace, monospace" fontSize="10" fill={C.ink} fontWeight="500">
        {Math.round(pct)}
      </text>
    </svg>
  );
}

          <div className="col-span-3">Last order</div>
          <div className="col-span-2 text-right">Orders</div>
          <div className="col-span-2 text-right">LTV</div>
        </div>
        <div className="flex flex-col">
          {TOP_CUSTOMERS.map(c => (
            <div key={c.name} className="grid grid-cols-12 items-center px-2 py-2.5 rounded-xl focus-row">
              <div className="col-span-5 flex items-center gap-3">
                <Avatar name={c.name}/>
                <div>
                  <div className="text-[14px]" style={{color:C.ink}}>{c.name}</div>
                  <div className="text-[12px]" style={{color:C.muted}}>{c.city}</div>
                </div>
              </div>
              <div className="col-span-3 text-[13px]" style={{color:C.deep}}>
                <div className="mono tnum">{c.last}</div>
                {c.status==='slipping' && (
                  <div className="text-[11px] mt-0.5" style={{color:C.warn}}>Quiet for {c.name==='Ananya Reddy'?'18':'10'} days</div>
                )}
              </div>
              <div className="col-span-2 text-right mono tnum text-[13px]" style={{color:C.ink}}>{c.orders}</div>
              <div className="col-span-2 text-right mono tnum text-[13px]" style={{color:C.ink}}>{inr(c.ltv)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
function Avatar({ name }) {
  const initials = name.split(' ').map(s=>s[0]).slice(0,2).join('');
  // deterministic blue tone by hash
  const tones = [C.deep, C.mid, C.teal, C.muted];
  const h = name.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const bg = tones[h % tones.length];
  return (
    <div className="w-9 h-9 rounded-full inline-flex items-center justify-center text-white text-[12px]" style={{ background: bg, fontWeight: 500 }}>
      {initials}
    </div>
  );
}

            <div className="flex-1 h-2 rounded-full" style={{ background: 'rgba(189,216,233,0.5)'}}>
